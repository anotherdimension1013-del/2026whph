<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" role="img" aria-label="合成孔径的形成：雷达在 A、B 之间飞过的距离 Ls 构成等效长天线阵列">
<title>合成孔径的形成：雷达在 A、B 之间飞过的距离 Ls 构成等效长天线阵列</title>
<defs>
  <marker id="arr21" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f4235"/></marker>
  <marker id="arr21o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0714c"/></marker>
</defs>
<style>
  text { font-family: inherit; fill: #3d4a40; font-size: 17px; }
  .t { font-weight: 700; font-size: 18px; }
  .m { fill: #8b947d; font-size: 15px; }
  .o { fill: #c0714c; font-weight: 700; }
  .g { fill: #4f7560; font-weight: 700; }
</style>
<text x="20.0" y="30.0" text-anchor="start" class="t">俯视：P 从进入波束到离开波束，雷达飞过的距离就是合成孔径长度</text>
<polygon points="214.4,130.0 75.8,417.0 353.0,417.0" fill="#dfe8da" stroke="none" stroke-width="1.2" opacity="0.55"/>
<line x1="214.4" y1="130.0" x2="75.8" y2="417.0" stroke="#4f7560" stroke-width="1" opacity="1"/>
<line x1="214.4" y1="130.0" x2="353.0" y2="417.0" stroke="#4f7560" stroke-width="1" opacity="1"/>
<polygon points="465.6,130.0 327.0,417.0 604.2,417.0" fill="#dfe8da" stroke="none" stroke-width="1.2" opacity="0.55"/>
<line x1="465.6" y1="130.0" x2="327.0" y2="417.0" stroke="#4f7560" stroke-width="1" opacity="1"/>
<line x1="465.6" y1="130.0" x2="604.2" y2="417.0" stroke="#4f7560" stroke-width="1" opacity="1"/>
<line x1="20.0" y1="130.0" x2="640.0" y2="130.0" stroke="#2f4235" stroke-width="1.4" opacity="1"/>
