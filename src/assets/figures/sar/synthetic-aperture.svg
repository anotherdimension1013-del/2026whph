<text x="550.0" y="90.0" text-anchor="start" class="t">vₐ</text>
<circle cx="214.4" cy="130" r="4" fill="#c0714c"/>
<circle cx="235.3" cy="130" r="4" fill="#c0714c"/>
<circle cx="256.3" cy="130" r="4" fill="#c0714c"/>
<circle cx="277.2" cy="130" r="4" fill="#c0714c"/>
<circle cx="298.1" cy="130" r="4" fill="#c0714c"/>
<circle cx="319.1" cy="130" r="4" fill="#c0714c"/>
<circle cx="340.0" cy="130" r="4" fill="#c0714c"/>
<circle cx="360.9" cy="130" r="4" fill="#c0714c"/>
<circle cx="381.9" cy="130" r="4" fill="#c0714c"/>
<circle cx="402.8" cy="130" r="4" fill="#c0714c"/>
<circle cx="423.7" cy="130" r="4" fill="#c0714c"/>
<circle cx="444.7" cy="130" r="4" fill="#c0714c"/>
<circle cx="465.6" cy="130" r="4" fill="#c0714c"/>
<text x="214.4" y="116.0" text-anchor="middle" class="t">A（P 进入波束）</text>
<text x="465.6" y="116.0" text-anchor="middle" class="t">B（P 离开波束）</text>
<line x1="214.4" y1="80.0" x2="465.6" y2="80.0" stroke="#c0714c" stroke-width="1.4" opacity="1" marker-end="url(#arr21o)"/>
<line x1="465.6" y1="80.0" x2="214.4" y2="80.0" stroke="#c0714c" stroke-width="1.4" opacity="1" marker-end="url(#arr21o)"/>
<text x="340.0" y="72.0" text-anchor="middle" class="o">合成孔径长度 Lₛ = βR</text>
<circle cx="340" cy="390" r="7" fill="#2f4235"/>
<text x="340.0" y="420.0" text-anchor="start" class="t">点目标 P</text>
<line x1="340.0" y1="130.0" x2="340.0" y2="390.0" stroke="#9aa093" stroke-width="1" opacity="1" stroke-dasharray="4 4"/>
<text x="348.0" y="273.0" text-anchor="start" class="t">R</text>
<text x="210.4" y="200.0" text-anchor="middle" class="g">β</text>
<polygon points="340.0,130.0 330.5,400.0 349.5,400.0" fill="#c0714c" stroke="none" stroke-width="1.2" opacity="0.35"/>
<line x1="340.0" y1="130.0" x2="330.5" y2="400.0" stroke="#c0714c" stroke-width="1.2" opacity="1"/>
<line x1="340.0" y1="130.0" x2="349.5" y2="400.0" stroke="#c0714c" stroke-width="1.2" opacity="1"/>
<text x="370.0" y="208.0" text-anchor="start" class="o">合成波束 βₛ（很窄）</text>
<text x="20.0" y="475.0" text-anchor="start" class="m">真实天线：波束宽 β = λ/D，在距离 R 处照亮 βR，方位分辨率差</text>
<text x="20.0" y="502.0" text-anchor="start" class="m">合成阵列：长度 Lₛ = βR ≫ D，波束 βₛ 很窄，方位分辨率 ≈ D/2</text>
</svg>
